<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>墨卷 · 主笔共创工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/maestro.css" />
</head>
<body class="maestro-page">
  <div class="maestro-workbench">
    <!-- 顶栏 -->
    <header class="maestro-topbar">
      <div class="topbar-left">
        <span class="brand-seal">墨</span>
        <div class="book-meta">
          <h1 class="book-title">青冥录：废材觉醒</h1>
          <div class="genre-tags">
            <span class="genre-tag">玄幻</span>
            <span class="genre-tag">复仇</span>
            <span class="genre-tag">宗门</span>
          </div>
        </div>
      </div>

      <div class="topbar-center">
        <div class="direction-input-group">
          <input
            type="text"
            class="direction-input"
            id="directionInput"
            placeholder="一句话方向：废材少年因血脉被夺，发誓重返宗门讨回公道……"
            value="废材少年因血脉被夺，发誓重返宗门讨回公道"
          />
          <button class="direction-expand" id="directionExpand" title="展开完整方向">▾</button>
        </div>
        <button class="btn-ideate" id="btnIdeate">
          <span class="btn-ico">✦</span>
          <span>让主笔构思</span>
        </button>
      </div>

      <div class="topbar-right">
        <div class="agent-status" id="agentStatus" data-state="idle">
          <span class="status-dot"></span>
          <span class="status-text">主笔空闲中</span>
        </div>
        <button class="theme-toggle" id="themeToggle" title="切换纸墨主题">墨</button>
      </div>
    </header>

    <!-- 展开的方向输入区 -->
    <div class="direction-panel" id="directionPanel">
      <div class="direction-fields">
        <label class="field-row">
          <span class="field-label">世界观基调</span>
          <input type="text" value="东方玄幻，强者为尊，血脉决定修行上限" />
        </label>
        <label class="field-row">
          <span class="field-label">核心冲突</span>
          <input type="text" value="主角被至亲背叛夺走血脉，必须在三年内夺回复仇" />
        </label>
        <label class="field-row">
          <span class="field-label">主角目标</span>
          <input type="text" value="重回宗门，击败圣子，找回失踪的妹妹" />
        </label>
      </div>
    </div>

    <!-- 三栏主体 -->
    <main class="maestro-body">
      <!-- 左栏：灵感池 -->
      <aside class="panel inspiration-panel">
        <div class="panel-header">
          <h2 class="panel-title">
            <span class="title-ico">◈</span>
            灵感池
            <span class="panel-count" id="inspCount">5</span>
          </h2>
          <button class="btn-icon" id="btnAddCard" title="自建灵感卡">+</button>
        </div>
        <div class="inspiration-list" id="inspirationList">
          <!-- 由 JS 生成 -->
        </div>
        <div class="adopted-header">已采纳</div>
        <div class="adopted-list" id="adoptedList"></div>
      </aside>

      <!-- 中栏：书籍骨架树 -->
      <section class="panel outline-panel">
        <div class="panel-header">
          <h2 class="panel-title">
            <span class="title-ico">▣</span>
            书籍骨架
          </h2>
          <div class="outline-actions">
            <button class="btn-text" id="btnExpandAll">全部展开</button>
            <button class="btn-text" id="btnCollapseAll">全部折叠</button>
          </div>
        </div>
        <div class="outline-tree" id="outlineTree">
          <!-- 由 JS 生成 -->
        </div>
      </section>

      <!-- 右栏：主笔共创对话 -->
      <aside class="panel chat-panel">
        <div class="panel-header">
          <h2 class="panel-title">
            <span class="title-ico">✦</span>
            主笔共创
          </h2>
          <label class="toggle-skeleton">
            <input type="checkbox" id="toggleSkeleton" checked />
            <span>查看骨架预览</span>
          </label>
        </div>
        <div class="chat-messages" id="chatMessages">
          <!-- 由 JS 生成 -->
        </div>
        <div class="chat-input-area">
          <div class="chat-input-wrap">
            <input type="text" class="chat-input" id="chatInput" placeholder="补充方向或让主笔调整……" />
            <button class="btn-send" id="btnSend">发送</button>
          </div>
        </div>
      </aside>
    </main>

    <!-- 底部：张力曲线抽屉 -->
    <div class="tension-drawer" id="tensionDrawer">
      <div class="drawer-handle" id="drawerHandle">
        <span class="handle-title">
          <span class="title-ico">〰</span>
          全书张力曲线
        </span>
        <button class="btn-icon-sm" id="btnToggleDrawer" title="折叠/展开">▾</button>
      </div>
      <div class="drawer-body" id="drawerBody">
        <div class="tension-canvas-wrap">
          <canvas id="tensionCanvas" width="1200" height="90"></canvas>
        </div>
        <div class="tension-legend">
          <span class="legend-item"><i class="dot planted"></i> 伏笔埋设</span>
          <span class="legend-item"><i class="dot resolved"></i> 伏笔回收</span>
          <span class="legend-item"><i class="line"></i> 情绪张力</span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/maestro.js"></script>
</body>
</html>
