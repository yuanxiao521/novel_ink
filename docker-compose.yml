# PostgreSQL 16 + pgvector（记忆 RAG 扩展）—— 涌现式小说 Agent 状态存储
services:
  db:
    image: rag-kb-postgres:pg16
    container_name: novel-ink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NOVEL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NOVEL_DB_PASSWORD}
      POSTGRES_DB: ${NOVEL_DB_NAME:-novel}
    ports:
      - "${NOVEL_DB_PORT:-5433}:5432"
    volumes:
      - novel-ink-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOVEL_DB_USER:-postgres} -d ${NOVEL_DB_NAME:-novel}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  novel-ink-data: