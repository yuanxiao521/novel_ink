[project]
name = "novel-desk-agent-backend"
version = "0.1.0"
description = "涌现式小说 Agent 后端：导演调度 + 世界（黑板）"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.2",
    "openai>=1.5",
    "charset-normalizer>=3.5.1",
]

# uv 虚拟项目：不打包成库，纯模块/脚本运行
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]
